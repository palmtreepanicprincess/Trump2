name: Build app
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(find . -iname "WhiteHouseArchive.zip" | head -1)
          echo "Using: $ZIP"
          unzip -q "$ZIP"
          ls
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug
        working-directory: WhiteHouseArchive
      - uses: actions/upload-artifact@v4
        with:
          name: WhiteHouseArchive-apk
          path: WhiteHouseArchive/app/build/outputs/apk/debug/app-debug.apk
